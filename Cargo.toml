[package]
name = "pi-source-extractor"
version = "0.1.0"
edition = "2024"
description = "Persistent, batched C++ source extraction for coding agents"
license = "MIT"

[dependencies]
num_cpus = "1.17"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "=0.26.13"
tree-sitter-cpp = "=0.23.4"

[profile.release]
lto = "thin"
codegen-units = 1
